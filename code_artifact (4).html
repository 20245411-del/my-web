<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 할 일</title>
    <style>
        /* CSS Reset 및 기본 변수 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --text-color: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --danger-color: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 12px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 16px 40px;
        }

        /* 메인 컨테이너 */
        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            padding: 24px;
            margin-top: 20px;
            position: relative;
        }

        /* 프로필 및 로그인 영역 */
        .user-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #f9fafb;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }

        .user-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-color);
        }

        .btn-auth {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-auth:hover {
            background-color: #f3f4f6;
        }

        /* 로그인 안내 화면 */
        .login-placeholder {
            text-align: center;
            padding: 40px 10px;
        }

        .login-placeholder h2 {
            font-size: 1.25rem;
            margin-bottom: 8px;
        }

        .login-placeholder p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .btn-google-login {
            margin: 0 auto;
            padding: 12px 24px;
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            color: #374151;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .btn-google-login:hover {
            background-color: #f9fafb;
            box-shadow: var(--shadow-md);
        }

        /* 저장 상태 표시 */
        .sync-status {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: right;
            margin-bottom: 8px;
            height: 16px;
        }

        .sync-status.saving {
            color: var(--primary-color);
            font-weight: 600;
        }

        /* 에러 메시지 상자 */
        .error-banner {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: var(--danger-color);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            word-break: break-all;
            display: none;
        }

        /* 연습 모드 안내 바 */
        .fallback-banner {
            background-color: #fffbe3;
            border: 1px solid #fde68a;
            color: #b45309;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }

        /* 오늘 날짜 영역 */
        .header-date {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-color);
            text-align: center;
            margin-bottom: 20px;
        }

        /* 진행도 (완료 개수 및 프로그레스 바) */
        .progress-section {
            margin-bottom: 24px;
            background-color: #f9fafb;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .progress-count {
            color: var(--primary-color);
            font-size: 1rem;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background-color: #e5e7eb;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--primary-color);
            border-radius: 5px;
            transition: width 0.3s ease;
        }

        /* 입력 폼 */
        .input-form {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .todo-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .todo-input:focus {
            border-color: var(--primary-color);
        }

        .btn-add {
            padding: 12px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s;
        }

        .btn-add:hover {
            background-color: var(--primary-hover);
        }

        /* 할 일 목록 */
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            min-height: 50px;
        }

        /* 할 일 카드 */
        .todo-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
            word-break: break-all;
        }

        .todo-card:hover {
            border-color: #d1d5db;
        }

        .todo-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            padding-right: 12px;
        }

        /* 커스텀 체크박스 */
        .checkbox-btn {
            width: 22px;
            height: 22px;
            border: 2px solid #d1d5db;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background-color: white;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .todo-card.completed .checkbox-btn {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .checkbox-btn::after {
            content: "✓";
            color: white;
            font-size: 14px;
            font-weight: bold;
            display: none;
        }

        .todo-card.completed .checkbox-btn::after {
            display: block;
        }

        .todo-text {
            font-size: 1rem;
            color: var(--text-color);
            transition: color 0.2s;
            line-height: 1.4;
            cursor: pointer;
        }

        .todo-card.completed .todo-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        /* 삭제 X 버튼 */
        .btn-delete {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 1.25rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            line-height: 1;
            transition: color 0.2s, background-color 0.2s;
            flex-shrink: 0;
        }

        .btn-delete:hover {
            color: var(--danger-color);
            background-color: #fee2e2;
        }

        /* 비어있을 때 메시지 */
        .empty-message {
            text-align: center;
            color: var(--text-muted);
            padding: 30px 0;
            font-size: 0.95rem;
        }

        /* 완료항목 삭제 버튼 */
        .action-section {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .btn-clear {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-clear:hover {
            background-color: #f3f4f6;
            color: var(--text-color);
        }

        /* 하단 안내 문구 */
        .footer-notice {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 상단 에러 메시지 패널 -->
        <div class="error-banner" id="errorBanner"></div>

        <!-- 오프라인/연습 모드 안내 -->
        <div class="fallback-banner" id="fallbackBanner">
            ⚠️ 클라우드 연결에 실패했거나 인터넷이 끊겨 <strong>연습 모드(로컬 저장)</strong>로 동작합니다.
        </div>

        <!-- 사용자 인증 헤더 (로그인 후 표시) -->
        <div class="user-section" id="userSection" style="display: none;">
            <div class="user-profile">
                <img id="userAvatar" class="user-avatar" src="" alt="Profile">
                <span id="userName" class="user-name"></span>
            </div>
            <button class="btn-auth" id="btnLogout">로그아웃</button>
        </div>

        <!-- 로그인 안내 화면 (로그인 전 표시) -->
        <div class="login-placeholder" id="loginView">
            <h2>오늘 할 일</h2>
            <p>구글 계정으로 로그인하여 나만의 할 일 목록을 안전하게 클라우드에 보관하세요.</p>
            <button class="btn-google-login" id="btnLogin">
                <svg width="18" height="18" viewBox="0 0 18 18">
                    <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
                    <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
                    <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
                </svg>
                구글 계정으로 로그인
            </button>
        </div>

        <!-- 메인 앱 콘텐츠 (로그인 성공 시 또는 연습 모드 시 활성화) -->
        <div id="appContent" style="display: none;">
            <!-- 오늘 날짜 -->
            <div class="header-date" id="currentDate"></div>

            <!-- 완료 개수 & 막대 그래프 -->
            <div class="progress-section">
                <div class="progress-info">
                    <span>진행 상황</span>
                    <span class="progress-count" id="progressCount">0 / 0</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
            </div>

            <!-- 동기화 상태 레이블 -->
            <div class="sync-status" id="syncStatus"></div>

            <!-- 입력칸 및 추가 버튼 -->
            <form class="input-form" id="todoForm">
                <input type="text" class="todo-input" id="todoInput" placeholder="오늘 할 일을 입력하세요..." required autocomplete="off">
                <button type="submit" class="btn-add">추가</button>
            </form>

            <!-- 할 일 목록 카드가 세로로 쌓이는 영역 -->
            <div class="todo-list" id="todoList"></div>

            <!-- 완료한 것 치우기 버튼 -->
            <div class="action-section">
                <button class="btn-clear" id="btnClearCompleted">완료한 것 치우기</button>
            </div>
        </div>

        <!-- 하단 데이터 안내 문구 -->
        <div class="footer-notice" id="footerNotice">
            내 할 일은 내 계정에만 저장되고 다른 사람은 볼 수 없습니다
        </div>
    </div>

    <!-- Firebase SDK v10 (Module System) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // 파이어베이스 설정값
        const firebaseConfig = {
            apiKey: "AIzaSyCTA4nXT9NVe6H7JUFIGLIL1NTJM-sNDDk",
            authDomain: "my-web-bb7e1.firebaseapp.com",
            projectId: "my-web-bb7e1",
            storageBucket: "my-web-bb7e1.firebasestorage.app",
            messagingSenderId: "758621622059",
            appId: "1:758621622059:web:d3f86818d7ddd348c9bf6e"
        };

        // 전역 상태 관리
        let app = null;
        let auth = null;
        let db = null;
        let currentUser = null;
        let todos = [];
        let saveTimeout = null;
        let isFallbackMode = false;

        // DOM Elements
        const errorBanner = document.getElementById('errorBanner');
        const fallbackBanner = document.getElementById('fallbackBanner');
        const userSection = document.getElementById('userSection');
        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');
        const btnLogin = document.getElementById('btnLogin');
        const btnLogout = document.getElementById('btnLogout');
        const loginView = document.getElementById('loginView');
        const appContent = document.getElementById('appContent');
        const currentDateEl = document.getElementById('currentDate');
        const progressCountEl = document.getElementById('progressCount');
        const progressBarFillEl = document.getElementById('progressBarFill');
        const syncStatusEl = document.getElementById('syncStatus');
        const todoForm = document.getElementById('todoForm');
        const todoInput = document.getElementById('todoInput');
        const todoListEl = document.getElementById('todoList');
        const btnClearCompleted = document.getElementById('btnClearCompleted');
        const footerNotice = document.getElementById('footerNotice');

        // 파이어베이스 초기화 시도
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.error("Firebase Initialization Error:", e);
            enableFallbackMode("설정 오류로 인해 연습 모드로 전환되었습니다.");
        }

        // 초기 실행
        window.addEventListener('DOMContentLoaded', () => {
            renderDate();

            if (auth && !isFallbackMode) {
                // 파이어베이스 인증 상태 감시
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        currentUser = user;
                        showLoggedInUI(user);
                        await loadTodosFromCloud(user.uid);
                    } else {
                        currentUser = null;
                        showLoggedOutUI();
                    }
                }, (error) => {
                    showError("인증 처리 중 오류가 발생했습니다: " + error.code);
                    enableFallbackMode();
                });
            } else {
                enableFallbackMode();
            }
        });

        // 1. 연습 모드(로컬 저장 전용) 스위치
        function enableFallbackMode(reason) {
            isFallbackMode = true;
            fallbackBanner.style.display = 'block';
            loginView.style.display = 'none';
            appContent.style.display = 'block';
            userSection.style.display = 'none';
            footerNotice.textContent = "이 목록은 현재 브라우저에만 저장됩니다 (연습 모드).";
            loadTodosFromLocalStorage();
            render();
        }

        // 에러 표시 보조 함수
        function showError(message) {
            errorBanner.style.display = 'block';
            errorBanner.textContent = message;
        }

        function clearError() {
            errorBanner.style.display = 'none';
            errorBanner.textContent = '';
        }

        // 2. 로그인 / 로그아웃 UI 제어
        function showLoggedInUI(user) {
            loginView.style.display = 'none';
            appContent.style.display = 'block';
            userSection.style.display = 'flex';
            userName.textContent = user.displayName || '사용자';
            userAvatar.src = user.photoURL || 'https://via.placeholder.com/36';
            footerNotice.textContent = "내 할 일은 내 계정에만 저장되고 다른 사람은 볼 수 없습니다";
            clearError();
        }

        function showLoggedOutUI() {
            loginView.style.display = 'block';
            appContent.style.display = 'none';
            userSection.style.display = 'none';
            syncStatusEl.textContent = '';
        }

        // 구글 로그인 처리
        btnLogin.addEventListener('click', async () => {
            clearError();
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login failed:", error);
                showError(`로그인 실패 [오류 코드: ${error.code}] ${error.message}`);
            }
        });

        // 로그아웃 처리
        btnLogout.addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                showError(`로그아웃 실패 [오류 코드: ${error.code}]`);
            }
        });

        // 3. 한국어 날짜 표시 함수
        function renderDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayNames = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
            const dayName = dayNames[now.getDay()];

            currentDateEl.textContent = `${year}년 ${month}월 ${date}일 ${dayName}`;
        }

        // 4. 데이터 불러오기 (Firestore 또는 localStorage)
        async function loadTodosFromCloud(uid) {
            syncStatusEl.textContent = "불러오는 중…";
            try {
                const docRef = doc(db, "users", uid, "data", "todos");
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    todos = data.items || [];
                } else {
                    todos = [];
                }
                syncStatusEl.textContent = "동기화됨";
                render();
            } catch (error) {
                console.error("Firestore Load Error:", error);
                showError(`클라우드 데이터를 불러오지 못했습니다. [오류 코드: ${error.code}]`);
                // Firestore 읽기 실패 시 연습 모드로 복구
                enableFallbackMode();
            }
        }

        function loadTodosFromLocalStorage() {
            const savedTodos = localStorage.getItem('my_daily_todos');
            if (savedTodos) {
                try {
                    todos = JSON.parse(savedTodos);
                } catch (e) {
                    todos = [];
                }
            } else {
                todos = [];
            }
        }

        // 5. 디바운싱(Debounce 0.6s)을 적용한 클라우드/로컬 저장 함수
        function triggerAutoSave() {
            render();

            if (isFallbackMode) {
                localStorage.setItem('my_daily_todos', JSON.stringify(todos));
                syncStatusEl.textContent = "로컬 저장됨";
                return;
            }

            if (!currentUser) return;

            syncStatusEl.textContent = "저장 중…";
            syncStatusEl.classList.add('saving');

            if (saveTimeout) {
                clearTimeout(saveTimeout);
            }

            saveTimeout = setTimeout(async () => {
                try {
                    const docRef = doc(db, "users", currentUser.uid, "data", "todos");
                    await setDoc(docRef, { items: todos });
                    syncStatusEl.textContent = "저장됨";
                    syncStatusEl.classList.remove('saving');
                } catch (error) {
                    console.error("Firestore Save Error:", error);
                    syncStatusEl.textContent = "저장 실패";
                    syncStatusEl.classList.remove('saving');
                    showError(`저장 중 오류가 발생했습니다: ${error.code}`);
                }
            }, 600);
        }

        // 6. 화면 렌더링
        function render() {
            todoListEl.innerHTML = '';

            if (todos.length === 0) {
                todoListEl.innerHTML = '<div class="empty-message">오늘 할 일이 없습니다.<br>새로운 할 일을 입력해 보세요!</div>';
            } else {
                todos.forEach((todo) => {
                    const card = document.createElement('div');
                    card.className = `todo-card ${todo.completed ? 'completed' : ''}`;

                    const leftDiv = document.createElement('div');
                    leftDiv.className = 'todo-left';

                    const checkbox = document.createElement('div');
                    checkbox.className = 'checkbox-btn';
                    checkbox.addEventListener('click', () => toggleTodo(todo.id));

                    const textSpan = document.createElement('span');
                    textSpan.className = 'todo-text';
                    textSpan.textContent = todo.text;
                    textSpan.addEventListener('click', () => toggleTodo(todo.id));

                    leftDiv.appendChild(checkbox);
                    leftDiv.appendChild(textSpan);

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'btn-delete';
                    deleteBtn.innerHTML = '&times;';
                    deleteBtn.setAttribute('title', '삭제');
                    deleteBtn.addEventListener('click', () => deleteTodo(todo.id));

                    card.appendChild(leftDiv);
                    card.appendChild(deleteBtn);

                    todoListEl.appendChild(card);
                });
            }

            updateProgress();
        }

        // 진행도 업데이트
        function updateProgress() {
            const total = todos.length;
            const completedCount = todos.filter(t => t.completed).length;

            progressCountEl.textContent = `${completedCount} / ${total}`;

            const percentage = total === 0 ? 0 : (completedCount / total) * 100;
            progressBarFillEl.style.width = `${percentage}%`;
        }

        // 7. 할 일 추가
        todoForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = todoInput.value.trim();
            if (!text) return;

            const newTodo = {
                id: Date.now(),
                text: text,
                completed: false
            };

            todos.push(newTodo);
            todoInput.value = '';
            todoInput.focus();

            triggerAutoSave();
        });

        // 8. 완료 상태 토글
        function toggleTodo(id) {
            todos = todos.map(todo => {
                if (todo.id === id) {
                    return { ...todo, completed: !todo.completed };
                }
                return todo;
            });
            triggerAutoSave();
        }

        // 9. 개별 항목 삭제
        function deleteTodo(id) {
            todos = todos.filter(todo => todo.id !== id);
            triggerAutoSave();
        }

        // 10. 완료한 항목 일괄 제거
        btnClearCompleted.addEventListener('click', () => {
            const hasCompleted = todos.some(t => t.completed);
            if (!hasCompleted) return;

            todos = todos.filter(todo => !todo.completed);
            triggerAutoSave();
        });
    </script>
</body>
</html>
