<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우주선 소행성 피하기</title>
    <style>
        /* 리셋 및 모바일 터치 최적화 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0b0d17;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 12px;
            overflow: hidden;
        }

        /* 메인 게임 컨테이너 */
        .game-container {
            width: 100%;
            max-width: 420px;
            background: #121324;
            padding: 16px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 229, 255, 0.15), inset 0 0 15px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            border: 2px solid #1f233e;
        }

        /* 상단 헤더: 남은 시간 & 점수 */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            background: #090a12;
            padding: 8px 14px;
            border-radius: 14px;
            border: 1px solid #232745;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 10px;
            color: #7b88a8;
            margin-bottom: 2px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 800;
            color: #00e5ff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
            font-family: monospace, monospace;
        }

        /* 난이도 표시 */
        .diff-display {
            font-size: 12px;
            font-weight: bold;
            color: #ff3366;
            text-shadow: 0 0 8px rgba(255, 51, 102, 0.6);
            letter-spacing: 1px;
        }

        /* 무기 상태 표시 바 */
        .weapon-container {
            width: 100%;
            margin-bottom: 8px;
            background: #090a12;
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid #232745;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px;
        }

        .stat-info {
            font-size: 11px;
            font-weight: bold;
            color: #00e5ff;
        }

        .weapon-level {
            font-size: 11px;
            font-weight: bold;
            color: #ffcc00;
        }

        .shield-status {
            font-size: 11px;
            font-weight: bold;
            color: #00ff66;
        }

        /* Canvas 게임 화면 */
        #gameCanvas {
            width: 100%;
            height: 400px;
            background: #04050a;
            border-radius: 14px;
            border: 2px solid #232d42;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* 컨트롤 버튼 */
        .btn {
            background: linear-gradient(135deg, #00e5ff, #0072ff);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 0 #004fb3, 0 8px 15px rgba(0, 229, 255, 0.3);
            transition: all 0.1s ease;
            width: 100%;
            margin-top: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #004fb3, 0 4px 6px rgba(0, 229, 255, 0.3);
        }

        /* 안내 문구 */
        .guide-text {
            font-size: 12px;
            color: #616f8a;
            margin-top: 8px;
            text-align: center;
        }

        /* 능격 선택 카드 UI 모달 */
        .upgrade-card-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-top: 15px;
        }

        .upgrade-card {
            background: linear-gradient(135deg, #1f2442, #101226);
            border: 2px solid #00e5ff;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .upgrade-card:hover, .upgrade-card:active {
            background: linear-gradient(135deg, #00e5ff, #0072ff);
            border-color: #ffffff;
            transform: scale(1.02);
        }

        .upgrade-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 4px;
        }

        .upgrade-desc {
            font-size: 12px;
            color: #d1d5db;
        }

        /* 게임 오버 / 승리 / 업그레이드 모달 */
        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 5, 10, 0.94);
            border-radius: 20px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(4px);
            overflow-y: auto;
        }

        .modal.show {
            display: flex;
        }

        /* 랭킹 / 점수 저장 UI */
        .score-save-section {
            width: 100%;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .name-input-group {
            display: flex;
            gap: 6px;
            width: 100%;
            max-width: 280px;
        }

        .name-input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #00e5ff;
            background: #090a12;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            text-align: center;
        }

        .save-btn {
            background: #00e5ff;
            color: #000;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .save-btn:active {
            transform: scale(0.95);
        }

        .leaderboard-box {
            width: 100%;
            max-width: 300px;
            background: rgba(9, 10, 18, 0.8);
            border: 1px solid #232745;
            border-radius: 10px;
            padding: 10px;
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
        }

        .leaderboard-title {
            font-size: 12px;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 12px;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #1f233e;
            color: #d1d5db;
        }

        .leaderboard-item:last-child {
            border-bottom: none;
        }

        .rank-num {
            color: #00e5ff;
            font-weight: bold;
            width: 24px;
            text-align: left;
        }

        .player-name {
            flex: 1;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-score {
            font-family: monospace;
            color: #ffcc00;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- 상단 헤더 -->
        <div class="header">
            <div class="stat-box">
                <span class="stat-label">GOAL</span>
                <span class="stat-value" style="font-size: 15px;">10000</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">DIFFICULTY</span>
                <span class="diff-display" id="diff-display">LV. 1</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">SCORE</span>
                <span class="stat-value" id="score-display">0</span>
            </div>
        </div>

        <!-- 무기 및 공격 속도 정보 바 -->
        <div class="weapon-container">
            <div class="stat-info" id="firerate-display">발사 간격: 1.25초</div>
            <div class="weapon-level" id="weapon-display">CANNON: LV.1</div>
            <div class="shield-status" id="shield-display">🛡️ SHIELD: OFF</div>
        </div>

        <!-- 캔버스 영역 -->
        <canvas id="gameCanvas" width="360" height="400"></canvas>

        <div class="guide-text" id="guide-text">손가락/마우스로 이동 | 자동으로 탄환 발사!</div>

        <!-- 시작 버튼 -->
        <button class="btn" id="start-btn" onclick="startGame()">게임 시작</button>

        <!-- 결과 화면 / 능력 선택 모달 -->
        <div class="modal" id="game-modal">
            <div class="modal-title" id="modal-title">GAME OVER</div>
            <div class="modal-sub" id="modal-sub">최종 점수</div>
            <div class="modal-score" id="final-score">0</div>
            
            <!-- 점수 저장 및 랭킹 UI -->
            <div class="score-save-section" id="save-section" style="display: none;">
                <div class="name-input-group" id="input-group">
                    <input type="text" class="name-input" id="player-name-input" maxlength="10" placeholder="닉네임 입력 (최대 10자)">

    <!-- Firebase 모듈 로드 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 설정 및 초기화
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'asteroids-game';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

        let db = null;
        let auth = null;
        let currentUser = null;
        let isScoreSaved = false;

        if (firebaseConfig) {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            // 인증 처리
            async function initAuth() {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        const userCred = await signInWithCustomToken(auth, __initial_auth_token);
                        currentUser = userCred.user;
                    } else {
                        const userCred = await signInAnonymously(auth);
                        currentUser = userCred.user;
                    }
                    loadLeaderboard();
                } catch (err) {
                    console.error("Auth error:", err);
                }
            }
            initAuth();
        }

        // 실시간 랭킹 데이터 수신
        function loadLeaderboard() {
            if (!db || !appId) return;

            const scoresCollection = collection(db, 'artifacts', appId, 'public', 'data', 'scores');
            
            onSnapshot(scoresCollection, (snapshot) => {
                const scores = [];
                snapshot.forEach(doc => {
                    scores.push(doc.data());
                });

                // 메모리 내 정렬 (상위 5개)
                scores.sort((a, b) => b.score - a.score);
                const topScores = scores.slice(0, 5);

                const listEl = document.getElementById('leaderboard-list');
                if (!listEl) return;

                if (topScores.length === 0) {
                    listEl.innerHTML = '<li style="color: #7b88a8;">등록된 기록이 없습니다.</li>';
                    return;
                }

                listEl.innerHTML = topScores.map((item, idx) => `
                    <li class="leaderboard-item">
                        <span class="rank-num">${idx + 1}.</span>
                        <span class="player-name">${escapeHtml(item.name || '익명')}</span>
                        <span class="player-score">${item.score}점</span>
                    </li>
                `).join('');
            }, (error) => {
                console.error("Leaderboard fetch error:", error);
            });
        }

        // 문자열 이스케이프 처리
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // 점수 저장 함수
        window.saveScore = async function() {
            if (isScoreSaved) return;

            const nameInput = document.getElementById('player-name-input');
            const saveBtn = document.getElementById('save-score-btn');
            const saveStatus = document.getElementById('save-status');
            const inputGroup = document.getElementById('input-group');

            const name = nameInput.value.trim() || '파일럿';
            const finalScore = window.currentScore || 0;

            if (!db || !currentUser) {
                alert("저장 기능에 연결할 수 없습니다.");
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = '저장 중...';

            try {
                // 개별 유저 기록 저장 문서 생성 (RULE 1 준수)
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'scores', currentUser.uid);
                await setDoc(docRef, {
                    name: name,
                    score: finalScore,
                    updatedAt: Date.now(),
                    userId: currentUser.uid
                }, { merge: true });

                isScoreSaved = true;
                inputGroup.style.display = 'none';
                saveStatus.style.display = 'block';
            } catch (err) {
                console.error("Score save error:", err);
                saveBtn.disabled = false;
                saveBtn.textContent = '다시 시도';
            }
        };

        // 점수 저장 영역 준비 상태 초기화
        window.resetSaveSection = function(score) {
            window.currentScore = score;
            isScoreSaved = false;

            const saveSection = document.getElementById('save-section');
            const inputGroup = document.getElementById('input-group');
            const saveStatus = document.getElementById('save-status');
            const saveBtn = document.getElementById('save-score-btn');

            if (saveSection) saveSection.style.display = 'flex';
            if (inputGroup) inputGroup.style.display = 'flex';
            if (saveStatus) saveStatus.style.display = 'none';
            if (saveBtn) {
                saveBtn.disabled = false;
                saveBtn.textContent = '저장';
            }

            if (db) {
                loadLeaderboard();
            }
        };
    </script>

        // 사운드 효과 (Web Audio API)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(freq, duration, type = 'sine') {
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                // 음향 지원 불가 시 예외 처리
            }
        }

        // 픽셀 도트용 캔버스 비트맵 렌더러
        function drawPixelArt(ctx, x, y, scale, pixelData, palette) {
            const rows = pixelData.length;
            const cols = pixelData[0].length;
            const startX = x - (cols * scale) / 2;
            const startY = y - (rows * scale) / 2;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const colorIndex = pixelData[r][c];
                    if (colorIndex !== 0) {
                        ctx.fillStyle = palette[colorIndex];
                        ctx.fillRect(
                            Math.floor(startX + c * scale),
                            Math.floor(startY + r * scale),
                            scale,
                            scale
                        );
                    }
                }
            }
        }

        // 기본 슈팅 속도: 5초당 4발 = 1.25초(1250ms)에 1발

        // 우주선 자동 발사 처리
        function autoShoot(now) {
            if (!isPlaying || isLandingSequence || isPausedForUpgrade) return;

            if (now - lastShotTime >= shotCooldown) {
                lastShotTime = now;

                const count = player.weaponCount;
                const spreadAngles = {

                        hitAsteroids: []             // 관통시 중복 타격 방지 목록

                playSound(440, 0.08, 'square');

        // 마우스/터치 조작

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const targetX = clientX - rect.left;

            player.x = Math.max(16, Math.min(canvas.width - 16, targetX));
        }

        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('touchmove', handleMove, { passive: true });

        // 게임 시작
        function startGame() {

        function updateWeaponUI() {

        // 메인 게임 루프
        function gameLoop(timestamp) {
            if (!isPlaying) return;

            if (isPausedForUpgrade) {
                // 일시 정지 상태에서는 추가 루프 없음
                return;
            }

            autoShoot(timestamp);

            if (isLandingSequence) {
                updateLandingSequence();
                renderLandingSequence();
            } else {
                update();
                render();
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // 상태 업데이트
        function update() {
            const currentTime = performance.now();

            // 10초(10,000ms) 지날 때마다 점수 10점 추가
            if (currentTime - lastTimeBonusScore >= 10000) {
                score += 10;
                scoreDisplay.textContent = score;
                lastTimeBonusScore += 10000;
            }

            // 20,000점 달성 시 승리 귀환 서퀀스 진입
            if (score >= TARGET_SCORE) {
                startLandingSequence();
                return;
            }

            // 500점 달성할 때마다 능력 선택 창 표시
            if (score >= lastUpgradeScore + 500) {
                lastUpgradeScore += 500;
                showUpgradeSelection();
                return;
            }

            // 난이도 레벨 계산 (200점당 1단계 상승)
            const diffLevel = Math.floor(score / 200) + 1;
            diffDisplay.textContent = `LV. ${diffLevel}`;

            // 시간 감속(Slow Motion) 타이머 업데이트
            let speedMultiplier = 1.0;
            if (slowMotionTimer > 0) {
                slowMotionTimer--;
                speedMultiplier = 0.4; // 소행성 이동 속도 60% 감속
            }

            // 배경 별 이동
            backgroundStars.forEach(bgStar => {
                bgStar.y += bgStar.speed * speedMultiplier;
                if (bgStar.y > canvas.height) {
                    bgStar.y = 0;
                    bgStar.x = Math.random() * canvas.width;
                }
            });

            // 소행성 생성 (점수와 난이도 상승에 맞춰 스폰 확률 증가)
            let baseChance = 0.03 + (diffLevel - 1) * 0.005;

            if (Math.random() < baseChance) {
                const isLarge = Math.random() < 0.35;
                const scale = isLarge ? 2.5 : 1.5;
                const radius = (16 * scale) / 2;
                asteroids.push({
                    x: Math.random() * (canvas.width - radius * 2) + radius,
                    y: -radius * 2,
                    scale: scale,
                    radius: radius * 0.8,
                    speed: Math.random() * 2 + 1.5 + (diffLevel - 1) * 0.2,
                    hp: isLarge ? 4 : 2,
                    maxHp: isLarge ? 4 : 2,
                    isLarge: isLarge
                });
            }

            // 보너스 점수 보석 아이템 생성
            if (Math.random() < 0.015) {
                stars.push({
                    x: Math.random() * (canvas.width - 30) + 15,
                    y: -20,
                    scale: 1.8,
                    radius: 12,
                    speed: 2.2
                });
            }

            // 추진체 부스터 파티클
            if (Math.random() < 0.6) {
                particles.push({
                    x: player.x + (Math.random() - 0.5) * 8,
                    y: player.y + 12,
                    vx: (Math.random() - 0.5) * 1,
                    vy: Math.random() * 2 + 2,
                    alpha: 1,
                    color: Math.random() < 0.5 ? '#ff0055' : '#ffcc00',
                    size: Math.random() < 0.5 ? 2 : 3
                });
            }

            // 소행성 이동 및 충돌 체크
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const ast = asteroids[i];
                ast.y += ast.speed * speedMultiplier; // 슬로우 모션 적용

                // 우주선 충돌 검사
                const dx = ast.x - player.x;
                const dy = ast.y - player.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < ast.radius + 12) {
                    if (hasShield) {
                        // 🛡️ 에너지 방어막 작동: 충돌 1회 방어
                        hasShield = false;
                        updateWeaponUI();
                        createPixelExplosion(player.x, player.y, ['#00ff66', '#00e5ff', '#ffffff'], 30);
                        playSound(800, 0.2, 'sine');
                        asteroids.splice(i, 1);
                        continue;
                    } else {
                        // 방어막이 없으면 게임 오버
                        createPixelExplosion(player.x, player.y, ['#ff0055', '#ffcc00', '#00e5ff', '#ffffff'], 36);
                        playSound(120, 0.3, 'sawtooth');
                        endGame(false);
                        return;
                    }
                }

                if (ast.y - ast.radius > canvas.height) {
                    asteroids.splice(i, 1);
                }
            }

            // 보석 점수 아이템 이동 및 자석 효과
            for (let i = stars.length - 1; i >= 0; i--) {
                const star = stars[i];

                if (hasMagnet) {
                    // 🧲 아이템 자석: 우주선 방향으로 자석처럼 끌려옴
                    const mdx = player.x - star.x;
                    const mdy = player.y - star.y;
                    const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
                    if (mdist < 180) {
                        star.x += (mdx / mdist) * 4;
                        star.y += (mdy / mdist) * 4;
                    } else {
                        star.y += star.speed * speedMultiplier;
                    }
                } else {
                    star.y += star.speed * speedMultiplier;
                }

                const dx = star.x - player.x;
                const dy = star.y - player.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < star.radius + 14) {
                    score += 50;
                    scoreDisplay.textContent = score;
                    createPixelExplosion(star.x, star.y, ['#ffcc00', '#ffffff', '#ff8800']);
                    playSound(880, 0.15, 'square');
                    stars.splice(i, 1);
                    continue;
                }

                if (star.y > canvas.height + 20) {
                    stars.splice(i, 1);
                }
            }

            // 파티클 업데이트
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.04;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            // 총알 이동 및 소행성 격파 검사
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;

                let bulletRemoved = false;

                for (let j = asteroids.length - 1; j >= 0; j--) {
                    const ast = asteroids[j];
                    
                    // 관통 탄환 중복 타격 방지
                    if (b.isPenetrating && b.hitAsteroids.includes(ast)) continue;

                    const dx = b.x - ast.x;
                    const dy = b.y - ast.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < ast.radius + b.radius) {
                        ast.hp -= b.isPenetrating ? 2 : 1; // 💥 관통탄은 추가 데미지

                        if (b.isPenetrating) {
                            b.hitAsteroids.push(ast); // 피격 목록에 추가하고 관통
                        } else {
                            bulletRemoved = true;
                        }

                        createPixelExplosion(b.x, b.y, b.isPenetrating ? ['#ff00ff', '#ffffff'] : ['#ffffff', '#ffcc00'], 8);
                        playSound(300, 0.05, 'triangle');

                        if (ast.hp <= 0) {
                            score += ast.isLarge ? 60 : 30;
                            scoreDisplay.textContent = score;
                            createPixelExplosion(ast.x, ast.y, ['#9aa8c7', '#68748e', '#ffcc00', '#ff0055'], ast.isLarge ? 24 : 14);
                            playSound(150, 0.2, 'sawtooth');
                            asteroids.splice(j, 1);
                        }

                        if (bulletRemoved) break;
                    }
                }

                if (bulletRemoved || b.y < -10 || b.x < -10 || b.x > canvas.width + 10) {
                    bullets.splice(i, 1);
                }
            }
        }

        // 500점마다 능력 선택 시스템 출력

            // 랜덤으로 3개의 서로 다른 능력 카드 뽑기
            const shuffled = allOptions.sort(() => 0.5 - Math.random());
            const selectedOptions = shuffled.slice(0, 3);

        // 💣 화면 전체 EMP 폭발 실행
        function triggerEMP() {
            createPixelExplosion(canvas.width / 2, canvas.height / 2, ['#00e5ff', '#ffffff', '#ffcc00', '#ff0055'], 80);
            playSound(100, 0.5, 'sawtooth');

            for (let i = asteroids.length - 1; i >= 0; i--) {
                const ast = asteroids[i];
                score += ast.isLarge ? 60 : 30;
                createPixelExplosion(ast.x, ast.y, ['#9aa8c7', '#ffcc00'], 15);
            }
            asteroids = [];
            scoreDisplay.textContent = score;
        }

        function resumeGameFromUpgrade() {
            modal.classList.remove('show');
            upgradeContainer.style.display = 'none';
            isPausedForUpgrade = false;
            const now = performance.now();
            lastShotTime = now; // 강화 직후 연속 발사 방지
            lastTimeBonusScore = now; // 일시 정지 후 생존 시간 보상 타이머 리셋
            requestAnimationFrame(gameLoop);
        }

        // 지구 귀환 서퀀스 시작
        function startLandingSequence() {
            isLandingSequence = true;
            asteroids = [];
            bullets = [];
            stars = [];
            earthY = -160;
        }

        function updateLandingSequence() {
            if (earthY < canvas.height / 2 - 40) {
                earthY += 0.8;
            }

            const targetX = canvas.width / 2;
            const targetY = earthY + 50;

            player.x += (targetX - player.x) * 0.03;
            player.y += (targetY - player.y) * 0.03;

            if (Math.random() < 0.8) {
                particles.push({
                    x: player.x + (Math.random() - 0.5) * 6,
                    y: player.y + 12,
                    vx: (Math.random() - 0.5) * 1,
                    vy: Math.random() * 2 + 2,
                    alpha: 1,
                    color: '#00e5ff',
                    size: 2
                });
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            if (earthY >= canvas.height / 2 - 45 && Math.abs(player.y - targetY) < 10) {
                endGame(true);
            }
        }

        function renderLandingSequence() {
            ctx.fillStyle = '#04050a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            backgroundStars.forEach(bgStar => {
                ctx.fillStyle = bgStar.color;
                ctx.fillRect(Math.floor(bgStar.x), Math.floor(bgStar.y), bgStar.size, bgStar.size);
            });

            drawPixelArt(ctx, canvas.width / 2, earthY, 10, EARTH_PIXELS, earthPalette);

            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
                ctx.restore();
            });

            drawPixelArt(ctx, player.x, player.y, player.scale, SPACESHIP_PIXELS, shipPalette);
        }

        // 폭발 파티클 생성
        function createPixelExplosion(x, y, colors, count = 24) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 7,
                    vy: (Math.random() - 0.5) * 7,
                    alpha: 1,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.floor(Math.random() * 3) + 2
                });
            }
        }

        // 화면 렌더링
        function render() {
            ctx.fillStyle = '#04050a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 시간 감속 활성화 시 화면 오라 효과
            if (slowMotionTimer > 0) {
                ctx.fillStyle = 'rgba(0, 229, 255, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            backgroundStars.forEach(bgStar => {
                ctx.fillStyle = bgStar.color;
                ctx.fillRect(Math.floor(bgStar.x), Math.floor(bgStar.y), bgStar.size, bgStar.size);
            });

            bullets.forEach(b => {
                ctx.fillStyle = b.isPenetrating ? '#ff00ff' : '#ffff00';
                ctx.fillRect(Math.floor(b.x - 2), Math.floor(b.y - 4), 4, 8);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(Math.floor(b.x - 1), Math.floor(b.y - 3), 2, 6);
            });

            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
                ctx.restore();
            });

            asteroids.forEach(ast => {
                drawPixelArt(ctx, ast.x, ast.y, ast.scale, ASTEROID_PIXELS, asteroidPalette);

                if (ast.hp < ast.maxHp) {
                    const barWidth = ast.scale * 12;
                    const barHeight = 3;
                    const hpRatio = ast.hp / ast.maxHp;

                    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                    ctx.fillRect(ast.x - barWidth / 2, ast.y - (ast.scale * 10), barWidth, barHeight);

                    ctx.fillStyle = hpRatio > 0.5 ? '#00ff66' : '#ff0055';
                    ctx.fillRect(ast.x - barWidth / 2, ast.y - (ast.scale * 10), barWidth * hpRatio, barHeight);
                }
            });

            stars.forEach(star => {
                drawPixelArt(ctx, star.x, star.y, star.scale, GEM_PIXELS, gemPalette);
            });

            // 우주선 렌더링
            drawPixelArt(ctx, player.x, player.y, player.scale, SPACESHIP_PIXELS, shipPalette);

            // 🛡️ 에너지 방어막 시각 효과 렌더링
            if (hasShield) {
                ctx.beginPath();
                ctx.arc(player.x, player.y, 22, 0, Math.PI * 2);
                ctx.strokeStyle = '#00ff66';
                ctx.lineWidth = 2;
                ctx.shadowColor = '#00ff66';
                ctx.shadowBlur = 10;
                ctx.stroke();
                ctx.shadowBlur = 0; // 초기화
            }
        }

        // 게임 종료
        function endGame(isSurvived) {
            isPlaying = false;
            isLandingSequence = false;
            cancelAnimationFrame(animationFrameId);

            finalScoreDisplay.style.display = 'block';
            modalBtn.style.display = 'block';
            upgradeContainer.style.display = 'none';

            if (isSurvived) {
                modalTitle.textContent = '10,000 PTS CLEARED!';
                modalTitle.style.color = '#00e5ff';
                modalSub.textContent = '지구 귀환 성공! 최종 점수';
                playSound(600, 0.3, 'triangle');
            } else {
                modalTitle.textContent = 'GAME OVER';
                modalTitle.style.color = '#ff0055';
                modalSub.textContent = '우주선이 파괴되었습니다! 최종 점수';
            }

            gameOver(score);
        }

        // 필수 규격 함수: gameOver(점수)
        function gameOver(finalScore) {
            finalScoreDisplay.textContent = finalScore;
            modal.classList.add('show');

            // 점수 저장 UI 노출 및 초기화
            if (window.resetSaveSection) {
                window.resetSaveSection(finalScore);
            }
        }

        // 모달 닫기 및 초기화
        function closeModalAndReset() {
            modal.classList.remove('show');
            upgradeContainer.style.display = 'none';
            
            const saveSection = document.getElementById('save-section');
            if (saveSection) saveSection.style.display = 'none';

            startBtn.style.visibility = 'visible';
            startBtn.textContent = '다시 하기';

            ctx.fillStyle = '#04050a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawPixelArt(ctx, canvas.width / 2, canvas.height - 45, player.scale, SPACESHIP_PIXELS, shipPalette);
        }

        closeModalAndReset();
    </script>
</body>
</html>
